[workspace]
members = [
    "app/src-tauri",
    "sidecars/vox-llm",
    "sidecars/vox-tts-clone",
    "sidecars/vox-tts-cloud",
]
resolver = "2"

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
strip = false
