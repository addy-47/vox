[package]
name = "vox-llm"
version = "0.1.0"
edition = "2021"
description = "Local GGUF LLM sidecar service for Vox (llama.cpp)"
authors = ["addy-47"]

[dependencies]
llama-cpp-4 = { version = "0.2.61", default-features = false, features = ["openmp", "mtmd"] }
llama-cpp-sys-4 = { version = "0.2.61", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
axum = { version = "0.8" }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
anyhow = "1"
thiserror = "2"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
