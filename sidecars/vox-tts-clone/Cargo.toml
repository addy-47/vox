[package]
name = "vox-tts-clone"
version = "0.1.0"
edition = "2021"
description = "Voice cloning sidecar service for Vox (Chatterbox local GGUF)"
authors = ["addy-47"]
autoexamples = false

[dependencies]
chatterbox-rs = { git = "https://github.com/addy-47/chatterbox-rs.git", rev = "c9d17bd", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8" }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
anyhow = "1"
thiserror = "2"
log = "0.4"
hound = "3.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
