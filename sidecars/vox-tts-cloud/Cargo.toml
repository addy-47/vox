[package]
name = "vox-tts-cloud"
version = "0.1.0"
edition = "2021"
description = "Cloud TTS sidecar service for Vox (Google Cloud TTS & Azure AI Speech)"
authors = ["addy-47"]

[dependencies]
google-cloud-texttospeech-v1 = "1"
google-cloud-gax = "1"
azure_identity = "1"
azure_core = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8" }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
parking_lot = "0.12"
chrono = "0.4"
anyhow = "1"
thiserror = "2"
log = "0.4"
dirs = "6"
hound = "3.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
