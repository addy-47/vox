[package]
name = "Vox"
version = "0.6.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { path = "./plugins/tauri-plugin-positioner", features = [
    "tray-icon",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
ringbuf = "0.4.7"
sherpa-onnx = "1.12.39"
hound = "3.5"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
crossbeam-channel = "0.5"
thread-priority = "1.1"

# Phase 6.3 — Session persistence
rusqlite = { version = "0.31", features = ["bundled"] }
gtk = { version = "0.18", features = ["v3_24"] }
cairo-rs = "0.18"

# Phase 4 — LLM runtime (llama.cpp Rust bindings, compiles llama.cpp from source, CPU-only)
llama-cpp-2 = "0.1.146"
llama-cpp-sys-2 = "0.1.146"

encoding_rs = "0.8.35"
regex = "1.12.3"
# Phase 7 — Packaging and runtime hardening
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"

sysinfo = "0.30"
dirs = "6"
walkdir = "2"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["stream", "rustls-tls"] }
tokio-util = "0.7"
futures-util = "0.3"
zip = "2.0"
tar = "0.4"
flate2 = "1.0"

[dev-dependencies]
# Helpers for integration tests
chrono = "0.4"
