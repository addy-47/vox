[package]
name = "Vox"
version = "0.8.6"
description = "Vox - A modern desktop voice inference engine built for edge devices."
authors = ["addy-47"]
edition = "2021"
default-run = "Vox"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { path = "./plugins/tauri-plugin-positioner", features = [
    "tray-icon",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
ringbuf = "0.4.7"
earshot = "1.1"
hound = "3.5"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
nnnoiseless = "0.4"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
crossbeam-channel = "0.5"
parking_lot = "0.12"
thiserror = "2"
thread-priority = "1.1"

turso = { version = "0.7.1" }

# Phase 4 — LLM runtime (llama.cpp Rust bindings, compiles llama.cpp from source, CPU-only)
# Dynamic linking disabled (default includes dynamic-link) — we want static linking
# for easier distribution. Explicitly enable openmp and mtmd which were also in defaults.
llama-cpp-4 = { version = "0.2.61", default-features = false, features = ["openmp", "mtmd"] }
llama-cpp-sys-4 = { version = "0.2.61", default-features = false }

chatterbox-rs = { git = "https://github.com/addy-47/chatterbox-rs.git", rev = "2fa6883", default-features = false }
query-sieve = { git = "https://github.com/addy-47/query-sieve-rs.git" }

encoding_rs = "0.8.35"
regex = "1.12.3"
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "ndarray"] }
ndarray = "0.17.2"
parakeet-rs = "0.3.6"
# Phase 7 — Packaging and runtime hardening
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"

chrono = "0.4"
sysinfo = "0.30"
clap = { version = "4", features = ["derive"] }
dirs = "6"
walkdir = "2"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json", "blocking"] }
tokio-util = "0.7"
futures-util = "0.3"
zip = "2.0"
tar = "0.4"
flate2 = "1.0"
once_cell = "1.21.4"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
rubato = "3.0.0"
audioadapter = "3.0.0"
audioadapter-buffers = "3.0.0"
base64 = "0.22.1"
uuid = { version = "1.23.3", features = ["v4"] }
symphonia = { version = "0.6.0", features = ["mp3", "flac", "wav", "aac"] }
symphonia-core = "0.6.0"
tokenizers = { version = "0.21.0", default-features = false, features = ["fancy-regex"] }
tiktoken-rs = "0.6.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
cairo-rs = "0.18"

[target.'cfg(not(target_os = "windows"))'.dependencies]
sherpa-onnx = { version = "1.13.2", default-features = false, features = ["static"] }

[target.'cfg(target_os = "windows")'.dependencies]
sherpa-onnx = { version = "1.13.2", default-features = false, features = ["shared"] }

[dev-dependencies]
# Helpers for integration tests
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
debug = false

[[bench]]
name = "vox_multi_session_bench"
harness = false

[[bench]]
name = "vox_bench"
harness = false

[[bench]]
name = "vector_bench"
harness = false

[[bench]]
name = "nli_bench"
harness = false

[[bench]]
name = "embedding_bench"
harness = false

[[bench]]
name = "vox_realtime_bench"
harness = false

[[bench]]
name = "tts_bench"
harness = false

[[bench]]
name = "vox_clone_bench"
harness = false

[[bench]]
name = "dedup_bench"
harness = false

[[bench]]
name = "translit_bench"
harness = false

[[example]]
name = "voice_clone"

[[example]]
name = "vops_tts"

[[example]]
name = "generate_simulation_dataset_clips"

[[example]]
name = "query_embeddings"
