[package]
name = "Vox"
version = "0.8.9"
description = "Vox - A modern desktop voice inference engine built for edge devices."
authors = ["addy-47"]
edition = "2021"
default-run = "Vox"

[lib]
name = "vox_lib"
# `staticlib` + `cdylib` are REQUIRED by the Android target: Gradle links the app
# against `libvox_lib.so`, and `tauri android build` fails with
# "Library artifact not found .../libvox_lib.so" without them.
#
# Note this means `cargo build`/`clippy` now also emit a staticlib and cdylib for
# the host. That is the standard Tauri layout, not Android-specific bloat, but it
# does add a little build time on every target.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ─── 1. Tauri Framework & Plugins ───────────────────────────────────────────
tauri = { version = "2", features = ["protocol-asset", "test"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
# Pinned EXACTLY. 2.5.x requires tauri ^2.12, which would drag the whole app
# off tauri 2.11 and destabilise the hand-built Android native toolchain.
# 2.4.0 requires tauri ^2.10 and is fully Android-capable.
tauri-plugin-notification = "=2.4.0"
tauri-plugin-global-shortcut = "2"

# ─── 2. Audio Capture, Playback & DSP ───────────────────────────────────────
cpal = "0.15"                  # Cross-platform audio I/O (ALSA, Pulse, CoreAudio, WASAPI)
ringbuf = "0.4.7"              # SPSC lock-free audio buffer
earshot = "1.1"                # Embedded lightweight VAD neural network (~1ms latency)
hound = "3.5"                  # WAV encoder/decoder
nnnoiseless = "0.4"            # Realtime speech noise suppression
rubato = "3.0.0"               # High-performance sinc-interpolated sample rate converter
audioadapter = "3.0.0"         # Audio buffer adapter abstraction
audioadapter-buffers = "3.0.0" # Audio buffer containers
symphonia = { version = "0.6.0", features = ["mp3", "flac", "wav", "aac"] } # Media container demuxing
symphonia-core = "0.6.0"       # Symphonia core primitives
sonora = "0.2.0"               # Pure-Rust WebRTC AEC3, NS, and AGC2 audio processing

# ─── 3. ML Inference & Language Processing ──────────────────────────────────
ort = { version = "=2.0.0-rc.13", features = ["download-binaries", "ndarray"] }                # ONNX Runtime bindings (1.28; fixes ReshapeFusion SIGSEGV on MiniLM INT8)
ndarray = "0.17.2"                                                                            # N-dimensional array processing for ONNX tensors
tokenizers = { version = "0.21.0", default-features = false, features = ["fancy-regex"] }    # HuggingFace tokenizers (BPE / WordPiece)
tiktoken-rs = "0.6.0"                                                                         # OpenAI BPE tokenizer for context budgeting

# Web Search Engine - https://github.com/addy-47/nexus-rs
nexus = { package = "nexuss", version = "0.1.3" } # Multi-engine web search, DOM extraction, weighted hybrid ranking, answer-presence verification

# ─── 4. Concurrency, Async & Threading ──────────────────────────────────────
tokio = { version = "1", features = ["full"] } # Primary async runtime
tokio-util = "0.7"                             # Tokio utilities (codecs, framers)
futures-util = "0.3"                           # Futures streams & combinators
async-trait = "0.1"                            # Asynchronous trait definitions
crossbeam-channel = "0.5"                      # High-throughput lock-free multi-producer telemetry channels
parking_lot = "0.12"                           # Fast, non-poisoning mutexes & RwLocks
thread-priority = "1.1"                        # OS thread priority controls for audio capture

# ─── 5. Networking & Realtime Speech-to-Speech ──────────────────────────────
# default-features = false drops `default-tls` (OpenSSL -> openssl-sys, which has no Android path).
# `charset`, `http2` and `system-proxy` are re-listed explicitly because they are also defaults and
# dropping them would change desktop behavior (Content-Type decoding, HTTP/2, corporate proxies).
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "charset", "http2", "system-proxy", "json", "blocking"] } # HTTP/HTTPS client for cloud LLM/TTS
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }       # WebSocket client for Gemini Live & Edge-TTS
rustls = { version = "0.23", features = ["ring"] }                                       # TLS cryptography provider

# ─── 6. System Integration, Clipboard & Input Simulation ────────────────────
# (Platform-specific drivers defined under cfg(desktop) below)

# ─── 7. Database & Persistence ──────────────────────────────────────────────
turso = { version = "0.8.2" } # Embedded libSQL/SQLite database engine

# ─── 8. Observability & Logging ─────────────────────────────────────────────
log = "0.4"                                                    # Facade for logging
env_logger = "0.11"                                            # Terminal logger backend
tracing = "0.1"                                                # Structured application tracing
tracing-subscriber = { version = "0.3", features = ["env-filter"] } # Tracing subscriber with dynamic filtering
tracing-appender = "0.2"                                       # Non-blocking file logging with daily rotation

# ─── 9. Serialization & Common Utilities ────────────────────────────────────
serde = { version = "1", features = ["derive"] } # Serialization framework
serde_json = "1"                                 # JSON data format
anyhow = "1"                                     # Application error handling
thiserror = "2"                                  # Domain-specific error hierarchies
chrono = "0.4"                                   # Date and timestamp calculations
sysinfo = "0.30"                                 # System hardware & process memory telemetry
dirs = "6"                                       # Standard OS directory discovery
uuid = { version = "1.23.3", features = ["v4"] } # Unique identifier generation
regex = "1.13"                                   # Regular expressions
encoding_rs = "0.8.35"                           # Character encoding conversions
base64 = "0.22.1"                                # Base64 encoder/decoder
sha2 = "0.10"                                    # SHA-256 model verification
walkdir = "2"                                    # Directory tree traversal
clap = { version = "4", features = ["derive"] }  # Command line argument parser
tar = "0.4"                                      # Tar archive extraction
flate2 = "1.0"                                   # Gzip decompression
zip = "2.0"                                      # Zip archive extraction
once_cell = "1.21.4"                             # Lazy static cell initialization
num2words = "0.4"                                # Spoken number and currency verbalization for TTS
text-processing-rs = "0.2.2"                      # NVIDIA NeMo Inverse Text Normalization (ITN) port for STT
 
# ─── 10. Remote Control (dependency surface) ─────────────────────────────────
# snow: the Noise_XX handshake (mutual authentication, forward-secret session
#       keys, replay protection). The remote-control spec forbids hand-rolled
#       cryptography, so the audited library is the only permitted option.
snow = "0.10"
# mdns-sd: advertisement and browsing of the `_vox._tcp.local` service used for
#          LAN discovery. Pure Rust, no async runtime dependency, no C toolchain.
mdns-sd = "0.21"
# qrcode: rendering of the pairing QR. The `image` feature is disabled: the
#         pairing surface needs the SVG renderer and the raw module matrix, and
#         the `image` crate's transitive tree is dead weight on Android.
qrcode = { version = "0.14", default-features = false, features = ["svg", "pic"] }
getrandom = "0.3"
zeroize = "1.8"
hex = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-positioner = { path = "./plugins/tauri-plugin-positioner", features = ["tray-icon"] }
arboard = { version = "3.4", features = ["wayland-data-control"] }
enigo = { version = "0.2", default-features = false }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = "2.0"
cairo-rs = "0.18"
libc = "0.2"
enigo = { version = "0.2", default-features = false, features = ["x11rb"] }


[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }

# ONNX Runtime uses the NNAPI execution provider on Android. This MUST stay
# target-scoped: `ort-sys/build/download/resolve.rs` requires the downloaded
# artifact's feature set to match the enabled cargo features EXACTLY, and the
# only `aarch64-linux-android` row in `dist.tsv` is `nnapi`. Enabling `nnapi`
# for desktop would break it — every desktop row is `none` or another EP
# (webgpu / cuda13 / directml), so the exact-match check fails the build.
[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["download-binaries", "ndarray", "nnapi"] }

# `check_mic_access` must ask Android whether RECORD_AUDIO is actually held.
# cpal cannot answer this: its Oboe host implements `default_input_device()` as
# `Some(Device(None))` unconditionally, so a device probe always reports a mic.
# `jni` is pinned to 0.21 to match wry's and cpal's existing jni version — a
# second major would put two incompatible jni types in one build.
# Both crates are already in Cargo.lock (via cpal/wry/oboe); this makes them direct.
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(not(target_os = "windows"))'.dependencies]
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"] }

[target.'cfg(target_os = "windows")'.dependencies]
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
# `test-util` gives the test tree a deterministic clock, so a timeout is
# exercised by advancing time rather than by waiting for it.
tokio = { version = "1", features = ["test-util"] }

# ─── 11. Benches and Evals ─────────────────────────────────

[[bench]]
name = "stt_bench"
harness = false

[[bench]]
name = "tts_bench"
harness = false

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "llm_bench"
harness = false

[[bench]]
name = "memory_pipeline_eval"
path = "evals/memory-pipeline/main.rs"
harness = false

[[bench]]
name = "agentic_tool_eval"
path = "evals/agentic-tool/main.rs"
harness = false
