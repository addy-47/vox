[package]
name = "Vox"
version = "0.8.7"
description = "Vox - A modern desktop voice inference engine built for edge devices."
authors = ["addy-47"]
edition = "2021"
default-run = "Vox"

[lib]
name = "vox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ─── 1. Tauri Framework & Plugins ───────────────────────────────────────────
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { path = "./plugins/tauri-plugin-positioner", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"

# ─── 2. Audio Capture, Playback & DSP ───────────────────────────────────────
cpal = "0.15"                  # Cross-platform audio I/O (ALSA, Pulse, CoreAudio, WASAPI)
ringbuf = "0.4.7"              # SPSC lock-free audio buffer
earshot = "1.1"                # Embedded lightweight VAD neural network (~1ms latency)
hound = "3.5"                  # WAV encoder/decoder
nnnoiseless = "0.4"            # Realtime speech noise suppression
rubato = "3.0.0"               # High-performance sinc-interpolated sample rate converter
audioadapter = "3.0.0"         # Audio buffer adapter abstraction
audioadapter-buffers = "3.0.0" # Audio buffer containers
symphonia = { version = "0.6.0", features = ["mp3", "flac", "wav", "aac"] } # Media container demuxing
symphonia-core = "0.6.0"       # Symphonia core primitives

# ─── 3. ML Inference & Language Processing ──────────────────────────────────
llama-cpp-4 = { version = "0.2.61", default-features = false, features = ["openmp", "mtmd"] } # Local GGUF LLM inference
llama-cpp-sys-4 = { version = "0.2.61", default-features = false }                             # Low-level llama.cpp C++ bindings
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "ndarray"] }                # ONNX Runtime bindings
ndarray = "0.17.2"                                                                            # N-dimensional array processing for ONNX tensors
parakeet-rs = "0.3.6"                                                                         # FastConformer RNNT STT inference (Nemotron)
chatterbox-rs = { git = "https://github.com/addy-47/chatterbox-rs.git", rev = "2fa6883", default-features = false } # Local voice cloning TTS
query-sieve = { git = "https://github.com/addy-47/query-sieve-rs.git" }                       # ModernBERT intent classifier
tokenizers = { version = "0.21.0", default-features = false, features = ["fancy-regex"] }    # HuggingFace tokenizers (BPE / WordPiece)
tiktoken-rs = "0.6.0"                                                                         # OpenAI BPE tokenizer for context budgeting

# ─── 4. Concurrency, Async & Threading ──────────────────────────────────────
tokio = { version = "1", features = ["full"] } # Primary async runtime
tokio-util = "0.7"                             # Tokio utilities (codecs, framers)
futures-util = "0.3"                           # Futures streams & combinators
crossbeam-channel = "0.5"                      # High-throughput lock-free multi-producer telemetry channels
parking_lot = "0.12"                           # Fast, non-poisoning mutexes & RwLocks
thread-priority = "1.1"                        # OS thread priority controls for audio capture

# ─── 5. Networking & Realtime Speech-to-Speech ──────────────────────────────
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json", "blocking"] } # HTTP/HTTPS client for cloud LLM/TTS
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }       # WebSocket client for Gemini Live & Edge-TTS
rustls = { version = "0.23", features = ["ring"] }                                       # TLS cryptography provider

# ─── 6. System Integration, Clipboard & Input Simulation ────────────────────
arboard = { version = "3.4", features = ["wayland-data-control"] } # Cross-platform clipboard with native Wayland protocol
enigo = { version = "0.2", default-features = false }                    # Native OS keyboard & mouse simulation (platform features added per-target below)
zbus = { version = "4", default-features = false, features = ["tokio"] }    # D-Bus IPC for Wayland XDG Desktop Portal shortcuts

# ─── 7. Database & Persistence ──────────────────────────────────────────────
turso = { version = "0.7.2" } # Embedded libSQL/SQLite database engine

# ─── 8. Observability & Logging ─────────────────────────────────────────────
log = "0.4"                                                    # Facade for logging
env_logger = "0.11"                                            # Terminal logger backend
tracing = "0.1"                                                # Structured application tracing
tracing-subscriber = { version = "0.3", features = ["env-filter"] } # Tracing subscriber with dynamic filtering
tracing-appender = "0.2"                                       # Non-blocking file logging with daily rotation

# ─── 9. Serialization & Common Utilities ────────────────────────────────────
serde = { version = "1", features = ["derive"] } # Serialization framework
serde_json = "1"                                 # JSON data format
anyhow = "1"                                     # Application error handling
thiserror = "2"                                  # Domain-specific error hierarchies
chrono = "0.4"                                   # Date and timestamp calculations
sysinfo = "0.30"                                 # System hardware & process memory telemetry
dirs = "6"                                       # Standard OS directory discovery
uuid = { version = "1.23.3", features = ["v4"] } # Unique identifier generation
regex = "1.12.3"                                 # Regular expressions
encoding_rs = "0.8.35"                           # Character encoding conversions
base64 = "0.22.1"                                # Base64 encoder/decoder
sha2 = "0.10"                                    # SHA-256 model verification
walkdir = "2"                                    # Directory tree traversal
clap = { version = "4", features = ["derive"] }  # Command line argument parser
tar = "0.4"                                      # Tar archive extraction
flate2 = "1.0"                                   # Gzip decompression
zip = "2.0"                                      # Zip archive extraction
once_cell = "1.21.4"                             # Lazy static cell initialization

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = "2.0"
cairo-rs = "0.18"
libc = "0.2"
enigo = { version = "0.2", default-features = false, features = ["x11rb"] }


[target.'cfg(not(target_os = "windows"))'.dependencies]
sherpa-onnx = { version = "1.13.2", default-features = false, features = ["static"] }

[target.'cfg(target_os = "windows")'.dependencies]
sherpa-onnx = { version = "1.13.2", default-features = false, features = ["shared"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
debug = false

