[package]
name = "Vox"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vox_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { path = "./plugins/tauri-plugin-positioner", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
ringbuf = "0.4"
sherpa-onnx = "1.12.39"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
gtk = { version = "0.18", features = ["v3_24"] }
cairo-rs = "0.18"

# Phase 4 — LLM runtime (llama.cpp Rust bindings, compiles llama.cpp from source, CPU-only)
llama-cpp-2 = "0.1.146"
llama-cpp-sys-2 = "0.1.146"


# Phase 4 — TTS ONNX runtime (load-dynamic per Directive 1: shares libonnxruntime with sherpa-onnx)
ort = { version = "2.0.0-rc.12", features = ["load-dynamic", "ndarray"] }

# Phase 4 — Tensor manipulation for TTS ONNX inputs/outputs
ndarray = "0.17"

# Reference voice WAV loading for TTS speaker conditioning
hound = "3"
encoding_rs = "0.8.35"

[dev-dependencies]
# Helpers for integration tests
chrono = "0.4"
