<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Vox | Ambient Intelligence</title>
    <script>
      // Pre-React boot: apply the user's saved theme + accent_seed from localStorage
      // (cached by applyAppearance() in settingsStore.ts) so the OrbitalLoader and
      // background render in the configured colors from the very first paint.
      // Eliminates the default-cyan -> configured-accent swap on first launch.
      (function() {
        try {
          var raw = localStorage.getItem("vox_appearance");
          var root = document.documentElement;
          if (!raw) {
            root.style.setProperty("--bg-boot", "#050505");
            return;
          }
          var saved = JSON.parse(raw);
          if (!saved) return;
          if (saved.theme === "light") {
            root.setAttribute("data-theme", "light");
            root.classList.add("light");
            root.classList.remove("dark");
            root.style.setProperty("--bg-boot", "#f1f5f9");
          } else {
            root.setAttribute("data-theme", "dark");
            root.classList.add("dark");
            root.classList.remove("light");
            root.style.setProperty("--bg-boot", "#050505");
          }
          if (saved.accent_seed && typeof saved.accent_seed === "string" && saved.accent_seed[0] === "#" && saved.accent_seed.length === 7) {
            var hex = saved.accent_seed;
            var r = parseInt(hex.slice(1, 3), 16);
            var g = parseInt(hex.slice(3, 5), 16);
            var b = parseInt(hex.slice(5, 7), 16);
            if (!isNaN(r) && !isNaN(g) && !isNaN(b)) {
              root.style.setProperty("--accent", r + ", " + g + ", " + b);
            }
          }
        } catch (e) {
          // localStorage unavailable or JSON malformed; fall through to defaults.
        }
      })();
    </script>
    <script>
      // Immediate window detection to prevent flash of background on transparent HUDs
      (function() {
        var isTray = window.location.pathname.includes("tray") || 
                     window.location.search.includes("window=tray") ||
                     (window.__TAURI_METADATA__ && window.__TAURI_METADATA__.windowLabel === "tray");
        var isToast = window.location.pathname.includes("toast") || 
                     window.location.search.includes("window=toast") ||
                     (window.__TAURI_METADATA__ && window.__TAURI_METADATA__.windowLabel === "toast");
        if (isTray) {
          document.documentElement.classList.add("is-tray");
        }
        if (isToast) {
          document.documentElement.classList.add("is-toast");
        }
      })();
    </script>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* Desktop-only: suppress touch scrolling/zoom gestures on fine-pointer
         devices. On touch devices (Android) scrolling and pinch must work. */
      @media (pointer: fine) {
        html, body, #root {
          touch-action: none;
        }
      }
      html:not(.is-tray):not(.is-toast), 
      body:not(.is-tray):not(.is-toast), 
      body:not(.is-tray):not(.is-toast) #root {
        background-color: var(--bg-boot, #050505);
        background: var(--bg-boot, #050505);
      }
      html.is-tray, 
      body.is-tray, 
      body.is-tray #root,
      html.is-toast, 
      body.is-toast, 
      body.is-toast #root {
        background-color: transparent !important;
        background: transparent !important;
      }

      /* ── Pre-React boot loader ─────────────────────────────────────────────
       * Pure CSS animated orb shown by the WebView from the very first paint.
       * React's OrbitalLoader (in App.tsx) replaces it once mounted; App's
       * mount effect calls window.__VOX_HIDE_BOOT_LOADER() to remove this
       * element. Eliminates the perceived 1-2s black-screen gap during dev
       * Vite cold start and the React tree mount. */
      html.is-tray #vox-boot-loader,
      html.is-toast #vox-boot-loader {
        display: none !important;
      }
      #vox-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg-boot, #050505);
        pointer-events: none;
      }
      #vox-boot-loader .vox-boot-icon {
        width: 64px;
        height: 64px;
        color: rgb(var(--accent, 0 219 233));
        animation: vox-boot-breath 2.4s ease-in-out infinite;
        will-change: transform, opacity;
      }
      #vox-boot-loader .vox-boot-wave {
        stroke-dasharray: 48;
        stroke-dashoffset: 48;
        animation: vox-boot-draw 2.4s ease-in-out infinite alternate;
      }
      @keyframes vox-boot-breath {
        0%, 100% {
          transform: scale(0.96);
          opacity: 0.82;
          filter: drop-shadow(0 0 4px rgba(var(--accent, 0 219 233), 0.2));
        }
        50% {
          transform: scale(1.03);
          opacity: 1;
          filter: drop-shadow(0 0 14px rgba(var(--accent, 0 219 233), 0.6));
        }
      }
      @keyframes vox-boot-draw {
        0% { stroke-dashoffset: 48; opacity: 0.6; }
        50% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -48; opacity: 0.85; }
      }
      /* Fade-out when React takes over */
      #vox-boot-loader.vox-fade-out {
        animation: vox-fade-out 0.4s ease forwards;
      }
      @keyframes vox-fade-out {
        from { opacity: 1; }
        to   { opacity: 0; }
      }
    </style>
    <script>
      // Desktop-only gesture suppression (Batch 5.2). On coarse-pointer
      // (touch) devices these listeners stay off so scroll/pinch work.
      (function() {
        var fine = false;
        try {
          fine = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
        } catch (e) {
          fine = false;
        }
        if (!fine) return;

        // Prevent pinch-to-zoom (ctrl + wheel)
        document.addEventListener('wheel', function(e) {
          if (e.ctrlKey) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent multi-touch pinch gestures
        document.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent macOS/Safari and WebKitGTK gesture events
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
        document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
        document.addEventListener('gestureend', function(e) { e.preventDefault(); });

        // Prevent Ctrl + +, Ctrl + -, Ctrl + =, Ctrl + 0 keyboard zoom
        document.addEventListener('keydown', function(e) {
          if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
            e.preventDefault();
          }
        });
      })();
    </script>
  </head>

  <body class="dark">
    <div id="error-root" style="display:none; position:fixed; inset:0; z-index:99999; padding:24px; background:#0a0a0a; color:#e5e5e5; font-family:monospace; font-size:13px; overflow:auto;"></div>
    <div id="root"></div>

    <!-- Pre-React boot loader. Shown by the WebView from the very first paint
         (before Vite cold start + React mount) so the user sees an animated
         loader instead of a black screen during the 1-2s Vite dev cold start.
         React's App.tsx mount effect calls window.__VOX_HIDE_BOOT_LOADER() to
         fade and remove this element. -->
    <div id="vox-boot-loader" aria-hidden="true">
      <div class="vox-boot-icon">
        <svg width="64" height="64" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
          <g opacity="0.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <line x1="8" y1="12" x2="8" y2="20" />
            <line x1="12" y1="8" x2="12" y2="24" />
            <line x1="16" y1="5" x2="16" y2="27" />
            <line x1="20" y1="8" x2="20" y2="24" />
            <line x1="24" y1="12" x2="24" y2="20" />
          </g>
          <path
            class="vox-boot-wave"
            d="M 6.5 16 C 8 16 8.5 11 10 11 C 11.5 11 12 18.5 13.5 18.5 C 14.5 18.5 15.2 24 16 24 C 16.8 24 17.5 18.5 18.5 18.5 C 20 18.5 20.5 11 22 11 C 23.5 11 24 16 25.5 16"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="4.5" cy="16" r="1.15" fill="currentColor" opacity="0.85" />
          <circle cx="27.5" cy="16" r="1.15" fill="currentColor" opacity="0.85" />
        </svg>
      </div>
    </div>
    <script>
      (function() {
        var el = document.getElementById("vox-boot-loader");
        window.__VOX_HIDE_BOOT_LOADER = function() {
          if (!el || el.dataset.fading === "1") return;
          el.dataset.fading = "1";
          el.classList.add("vox-fade-out");
          // Remove from DOM after the fade transition completes so it doesn't
          // sit as a layer-above transparent overlay.
          setTimeout(function() {
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }, 450);
        };
        // Safety: if React never mounts (e.g. JS load failure), fade the loader
        // after 15s so the user isn't stuck looking at it forever.
        setTimeout(function() {
          if (el && el.dataset.fading !== "1") {
            // No-op: just logged, the loader remains for the error handler
            // (which shows the error-root overlay) to take over.
          }
        }, 15000);
      })();
    </script>

    <!-- React Scan: automatic real-time visual inspection of wasted re-renders in DEV mode
    <script>
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        var s = document.createElement("script");
        s.src = "https://unpkg.com/react-scan/dist/auto.global.js";
        s.async = true;
        document.head.appendChild(s);
      }
    </script> -->
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Global error handler — catches EVERYTHING, shows on screen
      window.__VOX_ERRORS = [];
      const errorEl = document.getElementById('error-root');
      function showError(msg, stack) {
        window.__VOX_ERRORS.push({msg, stack, time: new Date().toISOString()});
        errorEl.style.display = 'block';
        document.getElementById('app-loading') && (document.getElementById('app-loading').style.display = 'none');
        errorEl.innerHTML = '<div style="color:#ff4444;font-weight:bold;margin-bottom:12px;font-size:16px;">⚠️ Vox Crashed</div>'
          + '<div style="margin-bottom:16px;color:#ff8888;">' + msg + '</div>'
          + (stack ? '<pre style="white-space:pre-wrap;opacity:0.6;font-size:11px;">' + stack + '</pre>' : '')
          + '<div style="margin-top:16px;border-top:1px solid #333;padding-top:12px;font-size:11px;opacity:0.5;">All errors logged to window.__VOX_ERRORS</div>';
      }
      window.onerror = function(msg, url, line, col, err) {
        showError(msg + ' (' + url + ':' + line + ':' + col + ')', err ? err.stack : '');
      };
      window.addEventListener('unhandledrejection', function(e) {
        const msg = e.reason?.message || e.reason || 'unknown';
        const stack = e.reason?.stack || '';
        window.__VOX_ERRORS.push({ msg: 'Unhandled Promise: ' + msg, stack, time: new Date().toISOString() });
        console.error('Unhandled Promise Rejection:', e.reason);
      });
    </script>
  </body>
</html>
