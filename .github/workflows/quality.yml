name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "app/pnpm-lock.yaml"
      - working-directory: app
        run: pnpm install --frozen-lockfile
      - working-directory: app
        run: pnpm lint
      - working-directory: app
        run: pnpm lint:dead || true
      - working-directory: app
        run: pnpm test
      - working-directory: app
        run: pnpm build

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - name: compile gate
        working-directory: app/src-tauri
        run: ./scripts/verify-targets.sh
